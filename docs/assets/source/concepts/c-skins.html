<!doctype html>
<html><head><meta charset="utf-8">
<!-- Concept C, "One list, six skins": a single topic list runs across the image; each slanted band re-skins the part it covers with a theme of the app (docs/assets/themes/tokens/themes.json). -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: #000; }
  .skin { position: absolute; inset: 0; background: var(--bg); color: var(--tp); font-family: var(--font, Inter), sans-serif; overflow: hidden; }
  .head { position: absolute; left: 56px; top: 38px; }
  .head .sub { font-size: 15px; font-weight: 700; letter-spacing: .1em; color: var(--at); }
  .head h1 { font-size: 104px; font-weight: 900; letter-spacing: -.045em; line-height: 1; color: var(--title); margin-top: 2px; }
  .list { position: absolute; left: 40px; right: 40px; top: 214px; background: var(--sf); border-radius: var(--r, 26px); border: var(--bd, none); }
  .row { display: flex; align-items: center; gap: 22px; padding: 0 30px; height: 84px; }
  .row + .row { border-top: var(--sepw, 1.5px) var(--seps, solid) var(--sep); }
  .dot { width: 16px; height: 16px; border-radius: var(--dr, 50%); background: var(--un); flex: none; }
  .row.read .dot { background: transparent; box-shadow: inset 0 0 0 2px var(--sep); }
  .row b { opacity: var(--bo, 1); flex: 1; font-size: 31px; font-weight: 650; letter-spacing: -.015em; white-space: nowrap; overflow: hidden; }
  .row.read b { font-weight: 450; color: var(--ts); }
  .row time { width: 60px; text-align: right; font-size: 20px; color: var(--ts); font-variant-numeric: tabular-nums; }
  .badge { font-size: 19px; font-weight: 800; padding: 3px 13px; border-radius: var(--br, 99px); background: var(--un); color: var(--oun); }
  .label { position: absolute; bottom: 30px; font: 700 13px 'JetBrains Mono', monospace; letter-spacing: .08em; color: var(--title); white-space: nowrap; }
  /* Only the terminal skin shows it; its titles are hidden so monospace metrics never leak past the seam. */
  .term { display: var(--term, none); position: absolute; right: 44px; top: 96px; font: 700 24px 'JetBrains Mono', monospace; color: var(--tp); }
</style></head>
<body>
<script>
const themes = [
  { n: 'SWIFT',        v: { bg:'radial-gradient(700px 500px at 30% 0%, #3a2f6e, transparent 70%), radial-gradient(600px 500px at 80% 100%, #4a2748, transparent 70%), #1C1F2B',
      sf:'#252836', title:'#FFFFFF', tp:'#FFFFFF', ts:'#ACADB3', at:'#C26BF2', sep:'#343744', un:'#C26BF2', oun:'#1C1F2B' } },
  { n: 'LEGACY CLAIR', v: { bg:'#F2F2F7', sf:'#FFFFFF', title:'#000000', tp:'#000000', ts:'#6C6C70', at:'#0F8096', sep:'#C6C6C8', un:'#0F8096', oun:'#FFFFFF' } },
  { n: 'LEGACY SOMBRE',v: { bg:'#000000', sf:'#1C1C1E', title:'#FFFFFF', tp:'#FFFFFF', ts:'#98989F', at:'#49D6F2', sep:'#38383A', un:'#49D6F2', oun:'#000000' } },
  { n: 'SPOOKTOBER',   v: { bg:'#140A1F', sf:'#24123A', title:'#FFEBD9', tp:'#FFEBD9', ts:'#CDB3E6', at:'#FF9A3D', sep:'#3B2257', un:'#FF7A00', oun:'#140A1F' } },
  { n: 'NOËL ABUSÉ',   v: { bg:'#0F4D2E', sf:'#FFF8EC', title:'#FFF8EC', tp:'#1B1410', ts:'#5E4B3C', at:'#E3B341', sep:'#E9D9BF', un:'#D21F3C', oun:'#FFFFFF' } },
  { n: 'RÉTRO 5250',   v: { bg:'#000000', sf:'#000000', title:'#33FF33', tp:'#33FF33', ts:'#1FB81F', at:'#33FF33', sep:'#1A7A1A', un:'#FFFF55', oun:'#000000',
      font:"'JetBrains Mono'", bo:'0', term:'block', r:'0px', bd:'1.5px dashed #1A7A1A', seps:'dashed', dr:'0', br:'0px' } },
];
// Invented topic titles: no real topic, member or post.
const rows = [
  ['[Topic unique] Clavier mécanique silencieux : lequel choisir pour coder la nuit ?', '21:47', 12],
  ['Mon NAS fait un bruit de cafetière, c’est grave docteur ?', '21:32', 3],
  ['[Photo] Vos plus beaux ratés de la semaine, édition brouillard', '20:58', 0],
  ['Swift 6.2 : la concurrence stricte m’a réconcilié avec le compilateur', '20:14', 41],
];
// Five equal bands and a wider last one, so the terminal band holds the whole badge and time column (its monospace metrics never meet a seam).
const W = 1280, H = 640, slant = 110, bw = 222, edges = [0, 1, 2, 3, 4, 5].map(i => i * bw).concat(W + slant + 2);
themes.forEach((t, i) => {
  const d = document.createElement('div'); d.className = 'skin';
  for (const [k, v] of Object.entries(t.v)) d.style.setProperty('--' + k, v);
  const x0 = edges[i] - slant, x1 = edges[i + 1] - slant;
  d.style.clipPath = `polygon(${x0 + slant}px 0, ${x1 + slant + 1}px 0, ${x1 + 1}px ${H}px, ${x0}px ${H}px)`;
  d.innerHTML = `<div class="head"><div class="sub">ONE FORUM · EVERY SKIN · NATIVE IN SWIFT</div><h1>SwiftHFR</h1></div>
        <div class="term">READY █</div>
    <div class="list">${rows.map(([b, tm, n]) => `<div class="row${n ? '' : ' read'}"><span class="dot"></span><b>${b}</b>${n ? `<span class="badge">${n}</span>` : ''}<time>${tm}</time></div>`).join('')}</div>
    <div class="label" style="left:${Math.max(40, x0 + 30)}px">${t.n}</div>`;
  document.body.appendChild(d);
});
</script>
</body></html>
