<!doctype html>
<html><head><meta charset="utf-8">
<!-- Concept A, "The lens": the phone lies on the printed forum page and shows what is under it, natively. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body { font-family: Inter, sans-serif; background: #f2691c; position: relative; }
  .stage { position: absolute; inset: 0; perspective: 2600px; perspective-origin: 62% 40%; }
  .plane { position: absolute; left: 395px; top: -150px; width: 1500px; height: 841px; transform-style: preserve-3d;
    transform: rotateX(54deg) rotateZ(-27deg); transform-origin: 40% 50%; }
  .page { position: absolute; inset: 0; background: #fff url(../hfr.webp) 0 0 / 100% auto no-repeat;
    box-shadow: -30px 40px 70px rgba(70,20,0,.45); }
  .shadow { position: absolute; left: 500px; top: 96px; width: 330px; height: 660px; border-radius: 60px;
    background: rgba(20,8,0,.55); filter: blur(22px); transform: translate3d(-26px, 30px, 1px); }
  .phone { position: absolute; left: 500px; top: 96px; width: 330px; height: 660px; border-radius: 54px; padding: 10px;
    background: linear-gradient(145deg, #3a3c41, #111214 40%, #26282c); transform: translateZ(26px); }
  .screen { width: 100%; height: 100%; border-radius: 45px; overflow: hidden; background: #f2f2f7; position: relative; }
  .island { position: absolute; top: 9px; left: 50%; width: 92px; height: 26px; margin-left: -46px; border-radius: 14px; background: #000; }
  .nav { padding: 48px 16px 0; }
  .nav .sub { font-size: 10px; font-weight: 700; color: #f2691c; letter-spacing: .08em; }
  .nav h2 { font-size: 27px; font-weight: 800; letter-spacing: -.02em; }
  .sec { margin: 10px 16px 5px; font-size: 10px; color: #6c6c70; letter-spacing: .04em; }
  .list { margin: 0 12px; background: #fff; border-radius: 12px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 9px; padding: 8px 11px; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 46px; right: 0; height: 1px; background: #e5e5ea; }
  .ic { width: 26px; height: 26px; border-radius: 7px; flex: none; }
  .row b { display: block; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .row small { display: block; font-size: 10px; color: #8a8a8e; white-space: nowrap; }
  .row .t { flex: 1; min-width: 0; overflow: hidden; }
  .pill { font-size: 10px; font-weight: 700; color: #fff; background: #f2691c; border-radius: 99px; padding: 1px 7px; }
  .title { position: absolute; left: 56px; top: 54px; color: #fff; }
  .title h1 { font-size: 76px; font-weight: 900; letter-spacing: -.045em; line-height: .95; }
  .title h1 span { color: #0b1b3d; }
  .title p { margin-top: 16px; font-size: 21px; font-weight: 600; line-height: 1.3; color: #0b1b3d; max-width: 300px; }
  .foot { position: absolute; left: 56px; bottom: 44px; font: 600 13px 'JetBrains Mono', monospace; color: rgba(11,27,61,.8); letter-spacing: .02em; }
</style></head>
<body>
<div class="stage"><div class="plane">
  <div class="page"></div>
  <div class="shadow"></div>
  <div class="phone"><div class="screen"><div class="island"></div>
    <div class="nav"><div class="sub">HARDWARE.FR</div><h2>Forums</h2></div>
    <div class="sec">CATÉGORIES</div>
    <div class="list" id="list"></div>
  </div></div>
</div></div>
<div class="title"><h1>Swift<span>HFR</span></h1><p>Same forum.<br>Now native on iOS.</p></div>
<div class="foot">Swift 6.2 · SwiftUI · iOS 27</div>
<script>
const cats = [['Hardware','Carte mère · Processeur','#f2691c',12],['Hardware – Périphériques','Écran · Clavier / Souris','#5e5ce6',0],
 ['Ordinateurs portables','Portable · Ultraportable','#0a84ff',3],['Overclocking, Cooling & Modding','CPU · GPU · Water Cooling','#30b0c7',5],
 ['Électronique, domotique, DIY','Conception · Dépannage','#a2845e',0],['Technologies Mobiles','Android · Tablette','#34c759',8],
 ['Apple','Mac · iPhone · iPad','#8e8e93',2],['Vidéo & Son','HiFi · Home Cinéma','#ff9f0a',0],['Photo numérique','Appareil · Objectif','#ff375f',2],
 ['Jeux Vidéo','PC · Consoles','#bf5af2',27],['Windows & Software','Logiciels · Tutoriels','#64d2ff',1]];
list.innerHTML = cats.map(([t,s,c,n]) => `<div class="row"><div class="ic" style="background:${c}"></div><div class="t"><b>${t}</b><small>${s}</small></div>${n?`<span class="pill">${n}</span>`:''}</div>`).join('');
</script>
</body></html>
