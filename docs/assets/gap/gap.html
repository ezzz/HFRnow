<style>

    --l-bg: #f6f6f6;          /* ThemeColors.m cell/nav background */
    --l-text: #000000;
    --l-sec: #8a8a8e;
    --l-accent: #59e3ff;      /* hue 190°, HSB(0.528,0.65,1.0): Common.swift:461-466 */
    --l-accent-ink: #1590b0;  /* same hue, readable on white, for text glyphs */
    --l-msg-header: #f4f4f4;  /* messageClassicHeaderBackgroundCSS, Common.swift:669-677 */
    --l-msg-text: #202020;    /* style-liste-light.css --color-text */
    --l-quote: silver;
    --l-superfav: rgba(250,189,115,0.18);

  * { box-sizing: border-box; }

  .status .r { display: flex; gap: 6px; align-items: center; }
  .homebar { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 140px; height: 5px; border-radius: 3px; background: #111; z-index: 60; }
  .band { position: absolute; left: 0; right: 0; background: #000; z-index: 45; color: #888; font-size: 12px; display: flex; align-items: center; justify-content: center; }

  /* Shared bits */
  .glass { background: rgba(255,255,255,.72); border: 1px solid rgba(0,0,0,.08); box-shadow: 0 2px 10px rgba(0,0,0,.10); backdrop-filter: blur(8px); }
  .circ { width: 38px; height: 38px; border-radius: 19px; display: flex; align-items: center; justify-content: center; }

  .l-app { position: absolute; inset: 0; background: var(--l-bg); color: var(--l-text); display: flex; flex-direction: column; }

  .l-large { font-size: 32px; font-weight: 800; padding: 2px 18px 8px; letter-spacing: -0.4px; }

  .l-row .t { display: flex; gap: 6px; align-items: baseline; }

  .mini-tab { position: absolute; z-index: 30; bottom: 24px; left: 14px; width: 50px; height: 50px; border-radius: 25px; display: flex; align-items: center; justify-content: center; }

  .note-in { position: absolute; z-index: 70; font-size: 11px; background: rgba(28,28,30,.85); color: #fff; padding: 3px 8px; border-radius: 8px; }

function device({ w, h, kind, land = false, content, overlays = "" }) {
  let deco = "";
  if (kind === "iphone") {
    deco = land
      ? `<div class="island" style="left:12px;top:${h / 2 - 62}px;width:36px;height:124px"></div>`
      : `<div class="island" style="top:11px;left:${w / 2 - 62}px;width:124px;height:36px"></div>`;
  } else if (kind === "duo-cover") {
    deco = `<div class="punch" style="top:16px;left:${w / 2 - 5.5}px"></div>`;
  } else if (kind === "duo-open") {
    deco = land
      ? `<div class="punch" style="top:14px;left:${w * 0.75}px"></div><div class="crease" style="top:0;bottom:0;left:${w / 2 - 14}px;width:28px"></div>`
      : `<div class="punch" style="left:${w - 140}px;top:20px"></div><div class="crease" style="left:0;right:0;top:${h / 2 - 14}px;height:28px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.10),rgba(0,0,0,0))"></div>`;
  }
  return `<div class="device ${kind.startsWith("duo") ? "duo" : ""}"><div class="screen" style="width:${w}px;height:${h}px">
    ${kind === "iphone" && land ? `<div style="position:absolute;top:0;bottom:0;left:58px;right:58px">${content}</div>` : content}${statusBar(land && kind === "iphone")}${deco}${overlays}<div class="homebar" style="${land ? "width:200px" : ""}"></div></div></div>`;
}

    <div class="grid">

        <div class="cell">${r.S()}<div class="caption">${r.Sc}</div></div>`).join("")}

}
