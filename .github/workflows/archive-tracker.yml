name: Archive ezzz/HFRnow tracker

# francoisgn/ios-app_SwiftHFR keeps a full copy of the SwiftHFR project (ADR 0010):
# - master: the commits of ezzz/HFRnow dev-swift (mirror-from-ezzz.yml);
# - tracker-archive (orphan branch, no workflows in it): every issue and every dev-swift PR, with
#   comments and reviews (JSON + Markdown), and the head commits of each PR as git bundles
#   (heads/pr-NNNN-<sha>.bundle), so fork commits survive.
# PR commits are never pushed as refs: a pushed branch or tag would run the workflows of
# untrusted fork commits in the mirror, with its secrets.
# The job only runs in the mirror; on ezzz/HFRnow it is skipped.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archive-tracker
  cancel-in-progress: false

jobs:
  archive:
    if: github.repository == 'francoisgn/ios-app_SwiftHFR'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The deploy key of mirror-from-ezzz.yml: it can push to this mirror only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: src
          fetch-depth: 0
          ssh-key: ${{ secrets.MIRROR_DEPLOY_KEY }}
      - name: Check out (or start) the tracker-archive branch
        working-directory: src
        run: |
          git config user.name "swifthfr-archive"
          git config user.email "swifthfr-archive@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin tracker-archive >/dev/null; then
            git fetch origin tracker-archive
            git worktree add -B tracker-archive ../archive FETCH_HEAD
          else
            git worktree add --orphan -b tracker-archive ../archive
          fi
      - name: Export issues and dev-swift PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 src/scripts/archive_tracker.py --repo ezzz/HFRnow --out archive
      - name: Keep the head commits of each dev-swift PR as a git bundle
        working-directory: src
        run: |
          mkdir -p ../archive/heads
          git ls-remote https://github.com/ezzz/HFRnow.git 'refs/pull/*/head' > ../pr-heads.txt
          while read -r sha ref; do
            n=${ref#refs/pull/}; n=${n%/head}
            grep -qx "$n" ../archive/pulls.txt || continue
            out="../archive/heads/pr-$(printf %04d "$n")-${sha}.bundle"
            [ -f "$out" ] && continue
            if ! git fetch -q --no-tags https://github.com/ezzz/HFRnow.git "$ref"; then
              echo "::warning::PR #$n: head not fetchable, skipped"; continue
            fi
            git update-ref refs/archive/tmp FETCH_HEAD
            if git merge-base --is-ancestor refs/archive/tmp origin/master; then
              echo "PR #$n: head already in master"; continue
            fi
            git bundle create -q "$out" refs/archive/tmp ^origin/master
          done < ../pr-heads.txt
          git update-ref -d refs/archive/tmp || true
      - name: Commit and push the archive
        working-directory: archive
        run: |
          git add -A
          # state.json changes on every run: commit only when an item or a bundle changed.
          if git diff --cached --quiet -- . ':!state.json'; then echo "nothing new"; exit 0; fi
          git commit -q -m "Tracker archive $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:tracker-archive
