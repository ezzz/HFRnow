name: CodeQL

on:
  push:
    branches: [dev-swift]
  pull_request:
    # `labeled`: adding the `codeql` label to a PR starts its Swift analysis (#477).
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Scheduled runs only fire from the default branch (ADR 0010).
    - cron: "27 4 * * 1"

permissions:
  contents: read

# A new push to a PR cancels its running analysis; pushes to dev-swift and scheduled runs are never cancelled.
# Any other label added to a PR gets a group of its own (run id), so relabelling never cancels a running analysis (#477).
# A re-run reuses the original event's labels: to start a Swift analysis, add `codeql`, do not re-run.
concurrency:
  group: >-
    codeql-${{ github.event_name == 'pull_request'
    && !(github.event.action == 'labeled' && github.event.label.name != 'codeql')
    && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Swift changes
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.diff.outputs.swift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        name: Does this change touch Swift code?
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Swift analysis takes ~15 min on a macOS runner; on PRs it only runs when the PR carries the `codeql` label
          # and Swift sources or the package manifest change (#477). Pushes to dev-swift and the schedule always analyze.
          if [ "$EVENT" != "pull_request" ]; then echo "swift=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # No pipe into grep -q: on a large diff the writer gets SIGPIPE and pipefail turns a match into a miss.
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          if grep -qE '\.swift$|(^|/)Package\.(swift|resolved)$' <<< "$changed"; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "swift=false" >> "$GITHUB_OUTPUT"
          fi

  analyze-actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: actions
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:actions"

  analyze-swift:
    name: Analyze (swift)
    needs: changes
    # Not a required check since #477: every push to dev-swift is analyzed, and a PR only when it carries the `codeql`
    # label (session, cookies, posting, or any change worth a pre-merge SAST pass). With the label, a failed change
    # detection still runs it.
    if: >-
      ${{ !cancelled()
      && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'codeql'))
      && (github.event.action != 'labeled' || github.event.label.name == 'codeql')
      && (needs.changes.result != 'success' || needs.changes.outputs.swift == 'true') }}
    # CodeQL's Swift extractor lags behind preview toolchains: analyze with the stable Xcode on macos-26.
    runs-on: macos-26
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: swift
          build-mode: manual
          queries: security-and-quality
      - name: Build (traced by CodeQL)
        shell: bash
        run: |
          xcodebuild -version
          set -o pipefail
          # Logs are not readable from cloud sessions; surface the tail of a failed build as annotations.
          if ! swift build --package-path Packages/HFRKit 2>&1 | tee build.log; then
            tail -n 25 build.log | sed 's/^/::error title=swift build::/'
            exit 1
          fi
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:swift"
