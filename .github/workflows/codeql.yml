name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-latest
            build-mode: none
          # CodeQL's Swift extractor lags behind preview toolchains: analyze with the stable Xcode on macos-26.
          - language: swift
            runner: macos-26
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      - if: matrix.build-mode == 'manual'
        name: Build (traced by CodeQL)
        shell: bash
        run: |
          xcodebuild -version
          set -o pipefail
          # Logs are not readable from cloud sessions; surface the tail of a failed build as annotations.
          if ! swift build --package-path Packages/HFRKit 2>&1 | tee build.log; then
            tail -n 25 build.log | sed 's/^/::error title=swift build::/'
            exit 1
          fi
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
