name: UX survey

# Questionnaire UX (#634, #635) : go vet, go test -race, node --test, govulncheck, puis construction et démarrage de l'image
# (compose.yaml compris : utilisateur non root, lecture seule, en-têtes, contrôle de santé). Filtré pour qu'une correction de libellé dans
# questions.md ou donnees.md relance le test de concordance.
on:
  pull_request:
    paths:
      - 'tooling/ux-survey/**'
      - 'docs/ux/questionnaire/questions.md'
      - 'docs/ux/questionnaire/donnees.md'
      - 'docs/ux/questionnaire/cadrage-construction.md'
      - 'docs/ux/questionnaire/visuels/**'
      - '.github/workflows/ux-survey.yml'
  push:
    branches: [dev-swift]
    paths:
      - 'tooling/ux-survey/**'
      - 'docs/ux/questionnaire/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go and Node tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tooling/ux-survey
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tooling/ux-survey/go.mod
          cache-dependency-path: tooling/ux-survey/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - run: node --test web/logique.test.mjs
      # Vulnérabilités connues, dépendances et bibliothèque standard (F4). Outil de CI épinglé, hors de go.mod.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Build and start with compose.yaml
        working-directory: tooling/ux-survey/deploy
        run: |
          set -euo pipefail
          donnees="$RUNNER_TEMP/ux-donnees"
          sudo install -d -m 0700 -o 65532 -g 65532 "$donnees"
          {
            echo "UX_ORIGINE=https://exemple.invalid"
            echo "UX_FERMETURE=2099-01-15T23:00:00+01:00"
            echo "UX_MENTION_MAJ=2026-11-09"
            echo "UX_PORT_HOTE=18080"
            echo "UX_DOSSIER_DONNEES=$donnees"
          } > "$RUNNER_TEMP/ux.env"
          docker compose --env-file "$RUNNER_TEMP/ux.env" up -d --build --wait --wait-timeout 90
      - name: Check the running container
        working-directory: tooling/ux-survey/deploy
        run: |
          set -euo pipefail
          c=$(docker compose --env-file "$RUNNER_TEMP/ux.env" ps -q ux-survey)
          test "$(docker inspect -f '{{.State.Health.Status}}' "$c")" = healthy
          test "$(docker inspect -f '{{.Config.User}}' "$c")" = 65532:65532
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$c")" = true
          test "$(docker inspect -f '{{json .HostConfig.CapDrop}}' "$c")" = '["ALL"]'
          # Le port n'est publié que sur la boucle locale de l'hôte.
          test "$(docker inspect -f '{{(index (index .NetworkSettings.Ports "8080/tcp") 0).HostIp}}' "$c")" = 127.0.0.1
          h=$(curl -fsSI http://127.0.0.1:18080/)
          for e in "content-security-policy: default-src 'none'" "x-content-type-options: nosniff" "referrer-policy: no-referrer" "strict-transport-security: max-age=31536000"; do
            echo "$h" | grep -qi "^$e" || { echo "en-tête absent : $e"; exit 1; }
          done
          test "$(docker image inspect -f '{{.Size}}' ux-survey:local)" -lt 30000000
          # Un vrai envoi, avec un agent, un référent, un texte libre et un pseudo reconnaissables, puis les journaux :
          # rien de tout cela, ni aucune adresse, ne doit y figurer.
          curl -fsS -o /dev/null -X POST http://127.0.0.1:18080/api/reponses \
            -H 'Origin: https://exemple.invalid' -H 'Content-Type: application/json' \
            -H 'X-Forwarded-For: 198.51.100.77' -H 'User-Agent: AgentSecretCI' -H 'Referer: https://referent-secret.invalid/' \
            -d '{"version":"2026-11-v1","jeton":"00000000000000000000000000000abc","site_web":"","duree_s":60,"reponses":{"P1":"iphone","G1":"TexteSecretCI","I1":"PseudoSecretCI"}}'
          curl -s -o /dev/null http://127.0.0.1:18080/inconnu-SecretCheminCI
          logs=$(docker logs "$c" 2>&1)
          echo "$logs"
          echo "$logs" | grep -q '"chemin":"/api/reponses"' || { echo "aucune ligne d'envoi dans le journal : le contrôle ne prouverait rien"; exit 1; }
          if echo "$logs" | grep -E 'SecretCI|referent-secret|00000000000000000000000000000abc|198\.51\.100|172\.31\.250'; then
            echo "le journal contient une donnée identifiante"; exit 1
          fi
          if echo "$logs" | grep -v '"adresse":"0.0.0.0:8080"' | grep -E '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "une adresse apparaît dans le journal"; exit 1
          fi
      - name: Stop
        if: always()
        working-directory: tooling/ux-survey/deploy
        run: docker compose --env-file "$RUNNER_TEMP/ux.env" down -v
