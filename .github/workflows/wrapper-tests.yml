name: Wrapper Tests

on:
  pull_request:
    paths:
      - "HFRswift/**"
      - "HFRswiftTests/**"
      - "Classes/**"
      - "SuperHFRplus.xcodeproj/**"
      - ".github/workflows/wrapper-tests.yml"
  push:
    paths:
      - "HFRswift/**"
      - "HFRswiftTests/**"
      - "Classes/**"
      - "SuperHFRplus.xcodeproj/**"
      - ".github/workflows/wrapper-tests.yml"
  workflow_dispatch:

jobs:
  wrapper-build-for-testing:
    name: Wrapper Build-For-Testing
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build HFRswiftTests (device SDK)
        run: |
          xcodebuild \
            -project SuperHFRplus.xcodeproj \
            -scheme HFRswift \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/HFRnowDerivedDataTests" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build-for-testing
