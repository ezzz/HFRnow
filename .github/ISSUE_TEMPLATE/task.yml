name: Task (roadmap / lot / chore)
description: Planned work item — migration lot, roadmap item, tooling, docs
labels: ["status: needs-triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: >-
        First thing a human reads. A user story ("As a <who>, I want <what>, so that <why>") or a two-line
        executive summary of the intent. Details go in the fields below.
      placeholder: "As a reader, I want …, so that …"
    validations: { required: true }
  - type: dropdown
    id: type
    attributes:
      label: Type
      options: [lot, roadmap, chore, docs, security]
    validations: { required: true }
  - type: input
    id: lot
    attributes: { label: Lot, placeholder: "LOT-007 (if applicable)" }
  - type: textarea
    id: scope
    attributes: { label: Scope and acceptance criteria }
    validations: { required: true }

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [high, medium, low]
    validations: { required: true }
  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      description: Your best estimate. Maintainers may adjust it.
      options: [trivial, easy, medium, difficult]
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [models, parsing, network, storage, client, app, tooling, ci, docs]
    validations: { required: true }
  - type: dropdown
    id: origin
    attributes:
      label: Origin
      description: Where the work comes from (AGENTS.md §7). Leave empty if unsure; maintainers set it. A legacy-app issue has none.
      options: [audit, initial-port, parity, deliberate-gap, swift-feedback, legacy-evolution, infra, none (legacy app)]
    validations: { required: false }
