# Single source of truth for labels. Synced by .github/workflows/labels.yml (creates/updates, never deletes). Documented in AGENTS.md §7.
- { name: "type: bug",            color: "d73a4a", description: "Something does not work as expected" }
- { name: "type: feature",        color: "a2eeef", description: "New capability or enhancement" }
- { name: "type: security",       color: "b60205", description: "Security issue or hardening" }
- { name: "type: roadmap",        color: "5319e7", description: "Roadmap item / phase work" }
- { name: "type: chore",          color: "c5def5", description: "Maintenance, tooling, CI" }
- { name: "type: docs",           color: "0075ca", description: "Documentation" }
- { name: "type: lot",            color: "8250df", description: "Migration lot from docs/LOTS.md" }
- { name: "priority: high",       color: "e11d21", description: "Do first" }
- { name: "priority: medium",     color: "fbca04", description: "Do soon" }
- { name: "priority: low",        color: "0e8a16", description: "When possible" }
- { name: "difficulty: trivial",  color: "c2e0c6", description: "Minutes, mechanical (Haiku)" }
- { name: "difficulty: easy",     color: "bfdadc", description: "Well specified, low risk (Sonnet)" }
- { name: "difficulty: medium",   color: "f9d0c4", description: "Needs design or careful porting (Opus)" }
- { name: "difficulty: difficult", color: "e99695", description: "High risk or ambiguity (Fable/Opus)" }
- { name: "area: models",         color: "ededed", description: "HFRModels" }
- { name: "area: parsing",        color: "ededed", description: "HFRParsing" }
- { name: "area: network",        color: "ededed", description: "HFRNetwork" }
- { name: "area: storage",        color: "ededed", description: "HFRStorage" }
- { name: "area: client",         color: "ededed", description: "HFRClient (multi-step flows)" }
- { name: "area: tooling",        color: "ededed", description: "Legacy-app tooling, fixtures, oracles" }
- { name: "area: app",            color: "ededed", description: "iOS app / UI" }
- { name: "area: ci",             color: "ededed", description: "CI, security tooling, repository settings" }
- { name: "area: docs",           color: "ededed", description: "Documentation" }
- { name: "codeql",               color: "1d76db", description: "Run CodeQL Swift analysis on this PR before merge (#477)" }
- { name: "status: needs-triage", color: "ffffff", description: "Not yet reviewed by a maintainer" }
- { name: "status: ready",        color: "0e8a16", description: "Specified and ready to be picked" }
- { name: "status: blocked",      color: "000000", description: "Waits on something that can be named and will end (lot, capture, access): a `### Blocked by` section says what" }
- { name: "status: on-hold",      color: "c5def5", description: "Held by a decision (milestone not open, operator's call), not by a dependency" }
- { name: "status: needs-decision", color: "f9d0c4", description: "Product decision expected before coding" }
- { name: "status: claimed",      color: "1d76db", description: "A session has claimed it (/claim comment); see the claim rules in AGENTS.md" }
- { name: "external: ready",      color: "c2e0c6", description: "Standalone work open to external contributors' agents (docs/agents/EXTERNAL-AGENTS.md)" }
- { name: "ledger",              color: "5319e7", description: "Retired and inert (#826): the ### Ledger section alone decides; do not set it" }
- { name: "ledger: done",         color: "c2e0c6", description: "The ledger entries of this merged PR are in the docs (#620)" }
- { name: "origin: audit",           color: "0b6e6e", description: "The LOT-000 audit and the non-port work it raised (gates, inventories); a port lot is initial-port" }
- { name: "origin: initial-port",    color: "138f8f", description: "Initial plan: a port lot of LOTS.md (even one the audit proposed), its captures and follow-ups" }
- { name: "origin: parity",          color: "1fb3b3", description: "Parity gap with legacy @ 2440d79 found later (H.1 (a) rows, UXD (a) items, parity checks)" }
- { name: "origin: deliberate-gap",  color: "5cc8c8", description: "Deliberate difference from legacy: (b) items, UXD evolutions, FEAT, M5, operator design choices" }
- { name: "origin: swift-feedback",  color: "99dede", description: "Found by testing SwiftHFR: operator device tests, beta testers, Mac checks, Bybifok on SwiftHFR" }
- { name: "origin: legacy-evolution", color: "c7eeee", description: "Backport of a legacy change made after 2440d79 (the 2fe43da3 sweep of #655)" }
- { name: "origin: infra",           color: "e3f6f6", description: "Repo, CI, tooling, process, orchestration or docs upkeep not tied to another origin" }
- { name: "host: mac",            color: "6e7781", description: "Needs the maintainer's Mac (Xcode, legacy app, live captures)" }
- { name: "direct-pr",            color: "d93f0b", description: "Break-glass: PR merged without issue/claim (Direct-PR line); counted for stats" }
- { name: "dependencies",         color: "0366d6", description: "Dependency update (Dependabot)" }
- { name: "beta-test finding",    color: "f9a825", description: "Reported during pre-beta or beta testing on a device; counted for stats" }
- { name: "moust4ki aka bybifok finding", color: "fbca04", description: "Found by Bybifok (GitHub moust4ki): credit them in the fix" }
- { name: "m4-review: performance",    color: "bfd4f2", description: "Found by the end-of-M4 performance review (#774)" }
- { name: "m4-review: quality",        color: "bfd4f2", description: "Found by the end-of-M4 quality review (#775)" }
- { name: "m4-review: duplicates",     color: "bfd4f2", description: "Found by the end-of-M4 duplicates and refactor review (#836)" }
- { name: "m4-review: external-audit", color: "bfd4f2", description: "Found by the end-of-M4 audit of outside contributors' lots (#326)" }
- { name: "m4-review: hig-wwdc",       color: "bfd4f2", description: "Found by the end-of-M4 UI/UX review against the HIG and WWDC24-26 (#866)" }
