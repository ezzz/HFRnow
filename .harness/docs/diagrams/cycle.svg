302.1 413.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M164.9 360.2 Q164.8 294.7 165.8 230.5 M165.1 360.2 Q164.4 295.9 165.3 229.7" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/><path d="M158.0 242.1 L165.0 230.0 L172.0 242.1" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="130.9" y="280.8" width="68.2" height="28.5" rx="4" fill="#ffffff"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#ec4899" text-anchor="middle" dominant-baseline="central"><tspan x="165.0" y="295.0">leçons</tspan></text><g opacity="1.0"><rect x="40" y="560" width="1120" height="150" rx="16" fill="#f8f9fa"/><rect x="40.5" y="559.5" width="1119.5" height="150.5" rx="16" fill="none" stroke="#757575" stroke-width="1"/><rect x="40.5" y="559.5" width="1119.5" height="150.5" rx="16" fill="none" stroke="#757575" stroke-width="1"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central"><tspan x="600.0" y="612.5">Un écart à une étape se règle à cette étape :</tspan><tspan x="600.0" y="635.0">décision produit manquante (à clarifier, on ne code pas), test vert sans le changement (refusé),</tspan><tspan x="600.0" y="657.5">boucle de CI ou de revue (arrêt, diagnostic, réaffectation), leçon déjà connue (resserrer l'auto-relecture)</tspan></text></g></svg>
