<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 -4 1168 738" width="1168" height="738" role="img"><rect x="16" y="-4" width="1168" height="738" fill="#ffffff"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#1e1e1e" text-anchor="start" dominant-baseline="central"><tspan x="300.0" y="38.8">Le cycle d'un changement, de l'intention à la leçon</tspan></text><g opacity="1.0"><rect x="40" y="110" width="250" height="120" rx="16" fill="#fff3bf"/><rect x="39.3" y="110.7" width="250.7" height="119.3" rx="16" fill="none" stroke="#f59e0b" stroke-width="2"/><rect x="39.8" y="110.2" width="250.2" height="119.8" rx="16" fill="none" stroke="#f59e0b" stroke-width="2"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central"><tspan x="165.0" y="145.0">1. Intention</tspan><tspan x="165.0" y="170.0">user story, erreurs,</tspan><tspan x="165.0" y="195.0">définition de fini</tspan></text></g><g opacity="1.0"><rect x="330" y="110" width="250" height="120" rx="16" fill="#c3fae8"/><rect x="329.4" y="110.6" width="250.6" height="119.4" rx="16" fill="none" stroke="#06b6d4" stroke-width="2"/><rect x="329.5" y="110.5" width="250.5" height="119.5" rx="16" fill="none" stroke="#06b6d4" stroke-width="2"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="middle" dominant-baseline="central"><tspan x="455.0" y="145.0">2. Issue prête</tspan><tspan x="455.0" y="170.0">labels, doublons,</tspan><tspan x="455.0" y="195.0">dépendances</tspan></text></g><path d="M289.4 169.5 Q310.5 170.7 330.2 169.6 M290.3 169.4 Q310.5 169.8 330.7 169.2" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round"/><path d="M317.9 163.0 L330.0 170.0 L317.9 177.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g opacity="1.0"><rect x="620" y="110" width="250" height="120" rx="16" fill="#a5d8ff"/><rect x